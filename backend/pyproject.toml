[project]
name = "userops-ai-backend"
version = "1.0.0"
description = "Context-aware FastAPI backend for UserOps AI"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.43",
    "psycopg2-binary==2.9.12",
    "pydantic-settings==2.10.1",
    "email-validator==2.2.0",
    "argon2-cffi==25.1.0",
    "PyJWT==2.10.1",
    "openai==2.46.0",
    "python-dotenv==1.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP040"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/main.py" = ["F401"]