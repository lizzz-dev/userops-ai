services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: userops_frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: userops_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-userops}:${POSTGRES_PASSWORD:-userops_dev_password}@db:5432/${POSTGRES_DB:-userops}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-before-deploying}
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      ALLOWED_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-oss-20b}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: userops_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-userops}
      POSTGRES_USER: ${POSTGRES_USER:-userops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-userops_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
